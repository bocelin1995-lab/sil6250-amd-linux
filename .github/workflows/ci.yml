name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Run shellcheck on scripts
        run: shellcheck scripts/*.sh

  bash-syntax:
    name: Bash syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check scripts
        run: |
          for f in scripts/*.sh; do
            echo "checking $f"
            bash -n "$f"
          done

  kernel-build:
    name: Build kernel probe (kernel-module compile smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq linux-headers-$(uname -r) build-essential
      - name: Build probe module
        run: |
          cd kernel-probe
          make
          test -f probe_mailbox.ko && echo "probe_mailbox.ko built OK"
